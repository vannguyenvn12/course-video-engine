<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Preset layout measure</title>
    <style>
      @keyframes stage-lattice-drift {
        from {
          background-position: 0 0, 0 0, 0 0, 0 0;
        }
        to {
          background-position: 0 96px, 0 48px, 48px 0, 96px 0;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0c0a0b;
      }
    </style>
  </head>
  <body>
    <script src="./preset-measure-bundle.js"></script>
  </body>
</html>
